# Lithuanian pronunciation lexicon for TTS.
# `spoken` is what every TTS engine receives (alias substitution), so it works
# across Google, ElevenLabs, Azure and Tilde without vendor-specific SSML.
# `stress` documents the accented syllable (kirtis) for reviewers / future
# phoneme-level (SSML <phoneme>) support. Keep entries public-domain terms only.
service_numbers: ["112"]
feminine_stems: [valand, par, dien, minut, sekund, savait, priedang, sien, eil, viet, taisykl, grup, ton]
terms:
  - {written: "LT72.lt", spoken: "el tė septyniasdešimt du taškas el tė"}
  - {written: "lt72.lt", spoken: "el tė septyniasdešimt du taškas el tė"}
  - {written: "LT72", spoken: "el tė septyniasdešimt du"}
  - {written: "112.lt", spoken: "vienas, vienas, du taškas el tė"}
  - {written: "pagd.lrv.lt", spoken: "pė a gė dė taškas el er vė taškas el tė"}
  - {written: "bpc.lrv.lt", spoken: "bė pė cė taškas el er vė taškas el tė"}
  - {written: "vilnius.lt", spoken: "vilnius taškas el tė"}
  - {written: "eso.lt", spoken: "e es o taškas el tė"}
