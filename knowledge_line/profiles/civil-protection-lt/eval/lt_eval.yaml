# Lithuanian evaluation set for the civil-protection profile.
# expected_action: answer | no_info | emergency_transfer | operator_transfer | language_transfer
# points: each point is a list of alternative phrasings; a point is "covered" if
# any alternative appears in the answer (accent- and inflection-insensitive,
# Lithuanian stemming). Answer points are taken from the cited public sources.
items:
  - id: shelter-generic
    question: "Kur man slėptis, jei paskelbtų oro pavojų?"
    expected_action: answer
    points:
      - ["priedang"]
      - ["rūsy", "rūsį", "patalp be lang", "vonios kambar", "sandėliuk"]
      - ["dviejų sienų", "dvi sienos"]
    sources: [lt72.lt]
  - id: shelter-eldership
    question: "Laba diena, kur man slėptis, jei paskelbtų oro pavojų? Gyvenu Žirmūnuose."
    expected_action: answer
    points:
      - ["Žirmūnų"]
      - ["priedang"]
    sources: [lt72.lt, data.gov.lt]
  - id: shelter-sign
    question: "Kaip atpažinti priedangą?"
    expected_action: answer
    points:
      - ["geltonas kvadratas", "geltonu kvadratu", "geltonas"]
      - ["PRIEDANGA", "užraš"]
    sources: [lt72.lt]
  - id: alert-red
